name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
      
      - name: Navigate to project folder & build
        run: |
          cd AbuLaithERP
          flutter pub get
          flutter analyze
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: AbuLaithERP/build/app/outputs/flutter-apk/app-release.apk
