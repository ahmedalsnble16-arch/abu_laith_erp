name: Build Flutter APK

on:
  push:
    branches: [ main, رئيسي ]
  pull_request:
    branches: [ main, رئيسي ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Locate Project and Build APK
        run: |
          # البحث الديناميكي عن مجلد Flutter الصحيح
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          
          echo "Building Flutter project inside directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          flutter pub get
          flutter build apk --release
          
          # نقل الـ APK الناتج لمكان آمن للرفع
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abu_laith_erp_apk
          path: output/app-release.apk
