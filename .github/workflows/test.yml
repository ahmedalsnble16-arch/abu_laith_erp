name: Flutter Build APK

on:
  push:
    branches: [ main, رئيسي ]
  pull_request:
    branches: [ main, رئيسي ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Reconstruct Flutter Project Structure
        run: |
          # 1. إنشاء المجلدات الفرعية المتوقعة
          mkdir -p temp_lib/apps

          # 2. نقل ملفات التطبيقات الفرعية لمجلد apps
          find . -maxdepth 1 -type f -name "*_app.dart" -exec cp {} temp_lib/apps/ \;
          find . -maxdepth 1 -type f -name "*.dart" ! -name "*_app.dart" -exec cp {} temp_lib/ \;

          if [ -d lib ]; then cp -r lib/* temp_lib/ 2>/dev/null || true; fi

          # 3. إعادة إنشاء هيكل المشروع الأساسي
          flutter create --org com.abulaith --project-name abu_laith_erp --overwrite .

          # 4. نقل الأكواد المنظمة إلى مجلد lib
          cp -r temp_lib/* lib/
          if [ -f lib/app.dart ] && [ ! -f lib/main.dart ]; then
            cp lib/app.dart lib/main.dart
          fi
          rm -rf temp_lib

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abu_laith_erp_apk
          path: build/app/outputs/flutter-apk/app-release.apk
